name: Sync Imóveis

on:
  # Cron desligado — produção na VPS (catalogo.grupourban.cloud) a partir de 2026-09-02.
  # workflow_dispatch permanece para rollback manual.
  workflow_dispatch:

jobs:
  sync:
    name: Sincronizar imóveis do feed XML → Turso
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar sync
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          IMOVEIS_XML_URL: ${{ secrets.IMOVEIS_XML_URL }}
        run: npm run sync:imoveis
