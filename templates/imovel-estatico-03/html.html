<!DOCTYPE html>
<html data-fmt="1080x1080">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link href="{{fonte_url}}" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  background: {{cor_primaria}};
  position: relative;
  font-family: '{{fonte}}', system-ui, sans-serif;
  color: #fcfcff;
}

.foto {
  position: absolute;
  inset: 0;
  width: 1080px;
  height: 1080px;
  object-fit: cover;
  object-position: center;
}

.vinheta {
  position: absolute;
  top: 0;
  left: 0;
  width: 1080px;
  height: 660px;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(8, 8, 9, 0.88) 0%,
    rgba(8, 8, 9, 0.58) 26%,
    rgba(8, 8, 9, 0.28) 52%,
    rgba(8, 8, 9, 0.08) 74%,
    rgba(8, 8, 9, 0) 100%
  );
}

.safe {
  position: absolute;
  top: 50px;
  left: 50px;
  width: 980px;
  height: 980px;
  z-index: 2;
}

.lockup {
  position: absolute;
  top: 12px;
  left: 36px;
  right: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.bairro {
  font-size: 108px;
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -0.03em;
  color: #fcfcff;
  text-shadow:
    0 1px 2px rgba(0, 0, 0, 0.65),
    0 8px 32px rgba(0, 0, 0, 0.55);
}

.sub {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  font-size: 32px;
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: 0.01em;
  color: #fcfcff;
  text-shadow:
    0 1px 2px rgba(0, 0, 0, 0.6),
    0 6px 22px rgba(0, 0, 0, 0.5);
}
.sub span:empty { display: none; }
.sub span:not(:first-child)::before {
  content: "·";
  margin: 0 0.4em;
  font-weight: 400;
  letter-spacing: 0;
  opacity: 0.8;
}
.sub .cod {
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.preco {
  display: inline-flex;
  align-items: center;
  margin-top: 36px;
  min-height: 76px;
  padding: 20px 44px;
  border-radius: 9999px;
  background: rgba(34, 34, 35, 0.9);
  color: #fcfcff;
  font-size: 40px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: lining-nums;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
}
.preco .sufixo { margin-left: 6px; opacity: 0.72; font-weight: 400; font-size: 28px; }
.preco .sufixo:empty { display: none; }
.preco:empty { display: none; }

.leitura {
  margin-top: 28px;
  padding: 16px 36px;
  background: rgba(252, 252, 255, 0.78);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-radius: 18px;
}

.ficha {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.015em;
  color: #222223;
}
.item {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.item svg {
  width: 28px;
  height: 28px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: none;
  flex-shrink: 0;
}
.item:empty,
.item:has(.n:empty) { display: none; }
.item + .item::before {
  content: "|";
  margin: 0 22px 0 18px;
  opacity: 0.42;
  font-weight: 300;
}

.marca {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
}
.marca img {
  height: 52px;
  width: auto;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.7));
}
</style>
</head>
<body>
<img class="foto" src="{{foto_url}}" alt="">
<div class="vinheta" aria-hidden="true"></div>

<div class="safe">
  <div class="lockup">
    <h1 class="bairro">{{bairro}}</h1>
    <p class="sub"><span>{{tipo}}</span><span>{{cidade}}</span><span class="cod">{{codigo}}</span></p>
    <p class="preco">{{valor}}<span class="sufixo">{{sufixo_valor}}</span></p>
    <div class="leitura">
    <p class="ficha">
      <span class="item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <span class="n">{{area_util}}</span>
      </span>
      <span class="item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
        <span class="n">{{quartos}}</span> quartos
      </span>
      <span class="item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4 8 6"/><path d="M14 4l2 2"/><path d="M12 4v2"/><path d="M4 10h16"/><path d="M6 10v4a6 6 0 0 0 12 0v-4"/><path d="M4 22v-2"/><path d="M20 22v-2"/></svg>
        <span class="n">{{suites}}</span> suítes
      </span>
      <span class="item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        <span class="n">{{vagas}}</span> vagas
      </span>
    </p>
    </div>
  </div>
  <div class="marca">
    <img src="{{logo_url_escuro}}" alt="{{nome_marca}}">
  </div>
</div>
</body>
</html>
